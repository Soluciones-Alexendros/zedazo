[workspace]
resolver = "2"
members = [
  "crates/zedazo-core",
  "crates/zedazo-cli",
  "crates/zedazo-api",
]
default-members = ["crates/zedazo-cli"]

[workspace.package]
version = "0.5.1"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Soluciones-Alexendros/zedazo"
homepage = "https://github.com/Soluciones-Alexendros/zedazo"

[workspace.dependencies]
zedazo-core = { path = "crates/zedazo-core", version = "0.5.1" }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
nom = "7"
regex = "1.10"
csv = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
strsim = "0.11"
thiserror = "2"
anyhow = "1"
jiff = "0.2"
chardetng = "0.1"
encoding_rs = "0.8"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

[profile.dist]
inherits = "release"
lto = "thin"
