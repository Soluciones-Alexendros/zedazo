# Jobs secrets (gitleaks) + sca (pnpm audit / cargo audit / OSV).
# Llamado desde security.yml (cron/PR/push) y desde ci.yml (grafo ci-gate).
# Sin gitleaks-action@v2 (licencia). Sin continue-on-error.
name: Reusable security

on:
  workflow_call:
    inputs:
      suite:
        description: "secrets | sca | all"
        type: string
        required: false
        default: all

permissions: {}

jobs:
  secrets:
    name: secrets
    if: ${{ inputs.suite == 'secrets' || inputs.suite == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Binario gitleaks (no la action de pago). Checksum release v8.30.1.
      - name: gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose

  sca:
    name: sca
    if: ${{ inputs.suite == 'sca' || inputs.suite == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Detect lockfiles
        id: locks
        run: |
          set -euo pipefail
          echo "cargo=$(test -f Cargo.lock && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(test -f apps/web/pnpm-lock.yaml && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.locks.outputs.pnpm == 'yes'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - name: Setup Node
        if: steps.locks.outputs.pnpm == 'yes'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: pnpm audit (prod, high)
        if: steps.locks.outputs.pnpm == 'yes'
        working-directory: apps/web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level=high

      - name: Setup Rust
        if: steps.locks.outputs.cargo == 'yes'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: cargo audit
        if: steps.locks.outputs.cargo == 'yes'
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1
        with:
          denyWarnings: false
          createIssues: false

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@19ec1116569a47416e11a45848722b1af31a857b # v1.9.0
        with:
          # Sale distinto de 0 si hay vulnerabilidades conocidas en los lockfiles.
          # El umbral high lo refuerzan pnpm audit y cargo audit arriba.
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock
            --lockfile=apps/web/pnpm-lock.yaml
