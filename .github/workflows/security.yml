# Secret scanning (gitleaks) + SCA (auditoría nativa + OSV).
# Solo cron + dispatch: en cada PR/push a main el grafo lo cubre ci.yml
# (jobs gitleaks / supply-chain → ci-gate). Sin duplicar checks en el rollup.
# Sin gitleaks-action@v2 (licencia). Sin continue-on-error.
name: Security

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-security.yml
    with:
      suite: secrets

  sca:
    name: sca
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-security.yml
    with:
      suite: sca
