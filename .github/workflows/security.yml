# Secret scanning (gitleaks) + SCA (auditoría nativa + OSV).
# Reutiliza reusable-security.yml (también en el grafo de ci-gate).
# Sin gitleaks-action@v2 (licencia). Sin continue-on-error.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-security.yml
    with:
      suite: secrets

  sca:
    name: sca
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-security.yml
    with:
      suite: sca
