#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "write"

# Evitar dos publicaciones concurrentes de la misma etiqueta.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      # Solo la matriz (compacta). El manifiesto completo en GITHUB_OUTPUT se filtraba
      # como secreto (v0.5.1: builds skipped → release sin binarios).
      matrix: ${{ steps.plan.outputs.matrix }}
      has-matrix: ${{ steps.plan.outputs.has_matrix }}
      pr-run-mode: ${{ steps.plan.outputs.pr_run_mode }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          jq -e '.ci.github.artifacts_matrix.include | length > 0' plan-dist-manifest.json
          # Matriz sola (sin changelog/body) para evitar filtrado de outputs.
          MATRIX=$(jq -c '.ci.github.artifacts_matrix' plan-dist-manifest.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "has_matrix=true" >> "$GITHUB_OUTPUT"
          echo "pr_run_mode=$(jq -r '.ci.github.pr_run_mode // empty' plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ needs.plan.outputs.has-matrix == 'true' && (needs.plan.outputs.publishing == 'true' || needs.plan.outputs.pr-run-mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Generate SBOM (CycloneDX) from Cargo.lock
  sbom:
    name: Generate SBOM
    needs:
      - plan
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        run: |
          # Workspace: generar SBOM del paquete publicable (binario zedazo)
          cargo cyclonedx --manifest-path crates/zedazo-cli/Cargo.toml --format json --override-filename sbom
          if [ ! -f sbom.json ] && [ -f crates/zedazo-cli/sbom.json ]; then
            mv crates/zedazo-cli/sbom.json sbom.json
          fi
          test -f sbom.json
          sha256sum sbom.json > sbom.json.sha256
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-sbom
          path: |
            sbom.json
            sbom.json.sha256

  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - sbom
    # Publicar solo con builds locales y SBOM en success (no skipped).
    # Global puede ir skipped si no hay installers (dist-workspace installers=[]).
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.build-local-artifacts.result == 'success' && needs.sbom.result == 'success' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          set -euo pipefail
          # Solo upload: la release definitiva la crea `gh release create` tras validar assets.
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --output-format=json > dist-manifest.json
          echo "artifacts uploaded successfully"
          # Metadatos de anuncio desde el manifiesto (archivo, no output gigante).
          jq -r '.announcement_title // empty' dist-manifest.json > "$RUNNER_TEMP/announcement_title.txt"
          jq -r '.announcement_github_body // empty' dist-manifest.json > "$RUNNER_TEMP/announcement_body.txt"
          jq -r 'if .announcement_is_prerelease then "true" else "false" end' dist-manifest.json > "$RUNNER_TEMP/announcement_prerelease.txt"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          ls -la
          required=(
            zedazo-aarch64-apple-darwin.tar.xz
            zedazo-aarch64-apple-darwin.tar.xz.sha256
            zedazo-x86_64-apple-darwin.tar.xz
            zedazo-x86_64-apple-darwin.tar.xz.sha256
            zedazo-x86_64-pc-windows-msvc.zip
            zedazo-x86_64-pc-windows-msvc.zip.sha256
            zedazo-aarch64-unknown-linux-gnu.tar.xz
            zedazo-aarch64-unknown-linux-gnu.tar.xz.sha256
            zedazo-x86_64-unknown-linux-gnu.tar.xz
            zedazo-x86_64-unknown-linux-gnu.tar.xz.sha256
            sbom.json
            sbom.json.sha256
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "FALTA: $f"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Assets incompletos; no se crea la release."
            exit 1
          fi
          # Verificar checksums (cargo-dist: hash o "hash  archivo")
          for f in zedazo-*.tar.xz zedazo-*.zip; do
            expected=$(awk '{print $1}' "${f}.sha256")
            actual=$(sha256sum "$f" | awk '{print $1}')
            test "$expected" = "$actual" || { echo "checksum mismatch: $f"; exit 1; }
          done
          expected_sbom=$(awk '{print $1}' sbom.json.sha256)
          actual_sbom=$(sha256sum sbom.json | awk '{print $1}')
          test "$expected_sbom" = "$actual_sbom"
          jq -e 'type == "object" and (has("bomFormat") or has("components") or has("metadata"))' sbom.json >/dev/null
          # Smoke del binario Linux x86_64 en el runner
          tar -xJf zedazo-x86_64-unknown-linux-gnu.tar.xz
          BIN=$(find . -type f -name zedazo | head -1)
          test -n "$BIN"
          "$BIN" --version
      - name: Create GitHub Release
        env:
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if [[ "$(cat "$RUNNER_TEMP/announcement_prerelease.txt")" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          TITLE=$(cat "$RUNNER_TEMP/announcement_title.txt")
          cp "$RUNNER_TEMP/announcement_body.txt" "$RUNNER_TEMP/notes.txt"
          # Un solo mecanismo de release definitiva tras validar assets.
          gh release create "${{ needs.plan.outputs.tag }}" \
            --target "$RELEASE_COMMIT" \
            $PRERELEASE_FLAG \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.txt" \
            artifacts/*

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

  publish:
    name: Publish to crates.io
    needs:
      - host
    # Igual que announce: sin always(), GHA salta el job si builds del grafo de host fueron skipped.
    if: ${{ always() && needs.host.result == 'success' && !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Cargo versions
        run: |
          set -euo pipefail
          ver=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="zedazo") | .version')
          echo "zedazo version=$ver tag=${{ github.ref_name }}"
          test -n "$ver"
      - name: Publish zedazo-core
        run: cargo publish -p zedazo-core --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: Wait for crates.io index
        shell: bash
        run: |
          set -euo pipefail
          ver=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="zedazo-core") | .version')
          for i in $(seq 1 30); do
            if curl -fsS "https://crates.io/api/v1/crates/zedazo-core/$ver" >/dev/null; then
              echo "zedazo-core $ver visible en crates.io"
              exit 0
            fi
            echo "intento $i: esperando índice..."
            sleep 10
          done
          echo "timeout esperando zedazo-core en crates.io"
          exit 1
      - name: Publish zedazo
        run: cargo publish -p zedazo --token ${{ secrets.CRATES_IO_TOKEN }}
