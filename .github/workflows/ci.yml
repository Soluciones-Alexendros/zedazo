name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, plan/zedazo-v060-seguridad]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  health:
    name: Health Check
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== Runner health check ==="
          command -v cc      && echo "✓ cc (build-essential)" || echo "✗ cc missing"
          command -v cargo   && echo "✓ cargo ($(cargo --version | head -1))" || echo "✗ cargo missing"
          command -v rustup  && echo "✓ rustup" || echo "✗ rustup missing"
          echo "=== All systems go ==="
        shell: bash

  check:
    name: Check (stable)
    needs: [health]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # zedazo-desktop (Tauri/GTK) se valida en jobs Desktop*; sin WebKitGTK en ubuntu-latest.
      - run: cargo check --workspace --all-features --exclude zedazo-desktop

  msrv:
    name: Check (MSRV 1.80)
    needs: [health]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.80
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --exclude zedazo-desktop

  fmt:
    name: Format
    needs: [health]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --exclude zedazo-desktop -- -D warnings

  test:
    name: Test
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --exclude zedazo-desktop

  doc:
    name: Doc
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --document-private-items --exclude zedazo-desktop

  docs-validate:
    name: Docs validate
    needs: [health]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make docs-validate

  parity:
    name: Parity CLI↔API (O10)
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p zedazo-api --test equivalence_http --all-features

  web:
    name: Web (apps/web)
    needs: [health]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ./node_modules/.bin/tsc --noEmit
      - run: ./node_modules/.bin/next lint
      - run: node scripts/design-tokens/build.mjs --check
      - run: node scripts/design-tokens/contrast.mjs
      - run: pnpm test
      - run: ./node_modules/.bin/next build
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Playwright e2e + a11y (fixtures mock; sin real-api ni screenshots)
        run: ./node_modules/.bin/playwright test --grep-invert 'screenshots|real-api'
        env:
          CI: true

  web-real-api:
    name: Web E2E API real
    needs: [check, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: apps/web
      - name: Playwright contra zedazo-api
        run: bash apps/web/scripts/e2e-real-api.sh
        env:
          CI: true
          CARGO_TARGET_DIR: ${{ github.workspace }}/target

  compose-smoke:
    name: Compose smoke (Docker)
    needs: [health]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Smoke stack local
        run: bash deploy/scripts/compose-smoke.sh

  deny:
    name: Deny (cargo-deny)
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Run cargo-deny
        run: cargo deny check

  coverage:
    name: Coverage
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov -p zedazo-core --lcov --output-path coverage/lcov.info --fail-under-lines 80 --fail-under-regions 75
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info

  # Wrappers canónicos P0 (no sustituyen jobs Rust maduros).
  # Equivalencia documentada en AGENTS.md.
  quality:
    name: quality
    if: ${{ always() && !cancelled() }}
    needs: [fmt, clippy, docs-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Agregar fmt + clippy + docs-validate
        run: |
          echo "quality ≡ fmt + clippy + docs-validate"
          echo "fmt=${{ needs.fmt.result }}"
          echo "clippy=${{ needs.clippy.result }}"
          echo "docs-validate=${{ needs.docs-validate.result }}"
          test "${{ needs.fmt.result }}" = success
          test "${{ needs.clippy.result }}" = success
          test "${{ needs.docs-validate.result }}" = success

  smoke:
    name: smoke
    if: ${{ always() && !cancelled() }}
    needs: [health, check]
    runs-on: ubuntu-latest
    steps:
      - name: Agregar health + check
        run: |
          echo "smoke ≡ health + check (compilación workspace)"
          echo "health=${{ needs.health.result }}"
          echo "check=${{ needs.check.result }}"
          test "${{ needs.health.result }}" = success
          test "${{ needs.check.result }}" = success

  secrets:
    name: secrets
    uses: ./.github/workflows/reusable-security.yml
    with:
      suite: secrets

  sca:
    name: sca
    uses: ./.github/workflows/reusable-security.yml
    with:
      suite: sca

  # --- Escritorio AppImage (ADR-0021 / W5A) ---------------------------------
  # Build en ubuntu-22.04 (glibc + WebKitGTK 4.1). Artefactos listos para
  # `gh release upload` al draft (release.yml); este workflow no publica.
  #
  # Smoke en contenedor Ubuntu 26: omitido. WebKitGTK/AppImage en
  # `container: ubuntu:26.04` suele fallar (FUSE/dmabuf/libs); un job
  # `continue-on-error` informativo colgaría de ci-gate sin señal útil.
  # Validación Ubuntu 26 = prueba manual del operador (guía W5B).
  # Acciones nuevas pinneadas por SHA (comentario = tag).

  desktop-appimage:
    name: Desktop AppImage
    needs: [health, web]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      NO_STRIP: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: ". -> target"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Deps sistema Tauri/WebKit
        run: bash scripts/desktop/install-linux-deps.sh
      - name: Build AppImage
        env:
          ZEDAZO_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export ZEDAZO_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash scripts/desktop/build-appimage.sh
      - name: Upload AppImage + checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-appimage
          path: |
            dist/desktop/*.AppImage
            dist/desktop/SHA256SUMS
            dist/desktop/build-info.txt
            dist/desktop/run-env.sh
          if-no-files-found: error
          retention-days: 14

  desktop-smoke:
    name: Desktop smoke (xvfb)
    needs: [desktop-appimage]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Deps xvfb/FUSE
        run: bash scripts/desktop/install-linux-deps.sh
      - name: Download AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-appimage
          path: dist/desktop
      - name: Smoke xvfb
        run: bash scripts/desktop/smoke-xvfb.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"

  desktop-e2e:
    name: Desktop e2e (tauri-driver)
    needs: [desktop-appimage]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Deps sistema
        run: bash scripts/desktop/install-linux-deps.sh
      - name: Download AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-appimage
          path: dist/desktop
      - name: E2E sample.vcf + I7 + paridad API↔CLI
        run: bash scripts/desktop/run-e2e.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          ZEDAZO_RUN_PARITY: "1"

  desktop-parity:
    name: Desktop parity (cribar)
    needs: [check]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Paridad CLI cribar + I7
        run: bash scripts/desktop/parity-cribar.sh
      - name: Upload parity summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-parity
          path: |
            dist/desktop/parity-cribar.txt
            dist/desktop/parity-limpio.vcf
            dist/desktop/parity-audit.tsv
          if-no-files-found: error
          retention-days: 14

  desktop-sbom:
    name: Desktop SBOM (CycloneDX)
    needs: [health]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Generar SBOM cargo + pnpm
        run: bash scripts/desktop/sbom.sh
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-sbom
          path: |
            dist/desktop/sbom-*.json
            dist/desktop/SBOM.SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  desktop-attest:
    name: Desktop attest (provenance)
    needs: [desktop-appimage]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-appimage
          path: dist/desktop
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/desktop/*.AppImage

  # Check único required (ruleset): agrega todos los jobs + secrets/sca + desktop.
  ci-gate:
    name: ci-gate
    if: ${{ always() && !cancelled() }}
    needs:
      - health
      - check
      - msrv
      - fmt
      - clippy
      - test
      - doc
      - docs-validate
      - parity
      - web
      - web-real-api
      - compose-smoke
      - deny
      - coverage
      - quality
      - smoke
      - secrets
      - sca
      - desktop-appimage
      - desktop-smoke
      - desktop-e2e
      - desktop-parity
      - desktop-sbom
      - desktop-attest
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Verificar needs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -e '
            to_entries
            | map(select(.value.result != "success"))
            | if length == 0 then true else
                error("ci-gate: jobs no success: " + (map(.key + "=" + .value.result) | join(", ")))
              end
          ' >/dev/null
