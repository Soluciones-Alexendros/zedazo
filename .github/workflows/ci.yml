name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  health:
    name: Health Check
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== Runner health check ==="
          command -v cc      && echo "✓ cc (build-essential)" || echo "✗ cc missing"
          command -v cargo   && echo "✓ cargo ($(cargo --version | head -1))" || echo "✗ cargo missing"
          command -v rustup  && echo "✓ rustup" || echo "✗ rustup missing"
          echo "=== All systems go ==="
        shell: bash

  check:
    name: Check (stable)
    needs: [health]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  msrv:
    name: Check (MSRV 1.80)
    needs: [health]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.80
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  fmt:
    name: Format
    needs: [health]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  doc:
    name: Doc
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --document-private-items

  docs-validate:
    name: Docs validate
    needs: [health]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make docs-validate

  parity:
    name: Parity CLI↔API (O10)
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p zedazo-api --test equivalence_http --all-features

  web:
    name: Web (apps/web)
    needs: [health]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ./node_modules/.bin/tsc --noEmit
      - run: ./node_modules/.bin/next lint
      - run: node scripts/design-tokens/build.mjs --check
      - run: node scripts/design-tokens/contrast.mjs
      - run: node --test src/lib/api.test.mjs src/lib/design-tokens-contrast.test.mjs src/lib/atoms-contract.test.mjs
      - run: ./node_modules/.bin/next build
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Playwright e2e + a11y
        run: ./node_modules/.bin/playwright test --grep-invert screenshots
        env:
          CI: true

  deny:
    name: Deny (cargo-deny)
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Run cargo-deny
        run: cargo deny check

  coverage:
    name: Coverage
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov -p zedazo-core --lcov --output-path coverage/lcov.info --fail-under-lines 80 --fail-under-regions 75
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info

  # Wrappers canónicos P0 (no sustituyen jobs Rust maduros).
  # Equivalencia documentada en AGENTS.md.
  quality:
    name: quality
    if: ${{ always() && !cancelled() }}
    needs: [fmt, clippy, docs-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Agregar fmt + clippy + docs-validate
        run: |
          echo "quality ≡ fmt + clippy + docs-validate"
          echo "fmt=${{ needs.fmt.result }}"
          echo "clippy=${{ needs.clippy.result }}"
          echo "docs-validate=${{ needs.docs-validate.result }}"
          test "${{ needs.fmt.result }}" = success
          test "${{ needs.clippy.result }}" = success
          test "${{ needs.docs-validate.result }}" = success

  smoke:
    name: smoke
    if: ${{ always() && !cancelled() }}
    needs: [health, check]
    runs-on: ubuntu-latest
    steps:
      - name: Agregar health + check
        run: |
          echo "smoke ≡ health + check (compilación workspace)"
          echo "health=${{ needs.health.result }}"
          echo "check=${{ needs.check.result }}"
          test "${{ needs.health.result }}" = success
          test "${{ needs.check.result }}" = success
