name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'plan/**']
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  health:
    name: Health Check
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== Runner health check ==="
          command -v cc      && echo "✓ cc (build-essential)" || echo "✗ cc missing"
          command -v cargo   && echo "✓ cargo ($(cargo --version | head -1))" || echo "✗ cargo missing"
          command -v rustup  && echo "✓ rustup" || echo "✗ rustup missing"
          echo "=== All systems go ==="
        shell: bash

  check:
    name: Check (stable)
    needs: [health]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      # zedazo-desktop (Tauri/GTK) se valida en jobs Desktop*; sin WebKitGTK en ubuntu-latest.
      - run: cargo check --workspace --all-features --exclude zedazo-desktop

  msrv:
    name: Check (MSRV 1.80)
    needs: [health]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ffa5102cf171ef44c6095daae18d851c024800b1 # 1.80
        with:
          toolchain: "1.80"
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo check --workspace --all-features --exclude zedazo-desktop

  fmt:
    name: Format
    needs: [health]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo clippy --workspace --all-targets --all-features --exclude zedazo-desktop -- -D warnings

  test:
    name: Test
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo test --workspace --all-features --exclude zedazo-desktop

  doc:
    name: Doc
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo doc --workspace --no-deps --document-private-items --exclude zedazo-desktop

  docs-validate:
    name: Docs validate
    needs: [health]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: make docs-validate

  parity:
    name: Parity CLI↔API (O10)
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo test -p zedazo-api --test equivalence_http --all-features

  web:
    name: Web (apps/web)
    needs: [health]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ./node_modules/.bin/tsc --noEmit
      - run: ./node_modules/.bin/next lint
      - run: node scripts/design-tokens/build.mjs --check
      - run: node scripts/design-tokens/contrast.mjs
      - run: pnpm test
      - run: ./node_modules/.bin/next build
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Playwright e2e + a11y (fixtures mock; sin real-api ni screenshots)
        run: ./node_modules/.bin/playwright test --grep-invert 'screenshots|real-api'
        env:
          CI: true

  web-real-api:
    name: Web E2E API real
    needs: [check, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: apps/web
      - name: Playwright contra zedazo-api
        run: bash apps/web/scripts/e2e-real-api.sh
        env:
          CI: true
          CARGO_TARGET_DIR: ${{ github.workspace }}/target

  compose-smoke:
    name: Compose smoke (Docker)
    needs: [health]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Smoke stack local
        run: bash deploy/scripts/compose-smoke.sh

  deny:
    name: Deny (cargo-deny)
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Install cargo-deny
        uses: taiki-e/install-action@63300d694c674b6bd0e1ca77d202a2bc41c4b623 # cargo-deny
        with:
          tool: cargo-deny
      - name: Run cargo-deny
        run: cargo deny check

  coverage:
    name: Coverage
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c3076e6fa5aeb9a93daf1bd8eff73345250a8a9c # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov -p zedazo-core --lcov --output-path coverage/lcov.info --fail-under-lines 80 --fail-under-regions 75
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info

  # Wrappers canónicos P0 (no sustituyen jobs Rust maduros).
  # Equivalencia documentada en AGENTS.md.
  quality:
    name: quality
    if: ${{ always() && !cancelled() }}
    needs: [fmt, clippy, docs-validate]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Agregar fmt + clippy + docs-validate
        env:
          FMT: ${{ needs.fmt.result }}
          CLIPPY: ${{ needs.clippy.result }}
          DOCS_VALIDATE: ${{ needs.docs-validate.result }}
        run: |
          echo "quality ≡ fmt + clippy + docs-validate"
          echo "fmt=${FMT}"
          echo "clippy=${CLIPPY}"
          echo "docs-validate=${DOCS_VALIDATE}"
          test "${FMT}" = success
          test "${CLIPPY}" = success
          test "${DOCS_VALIDATE}" = success

  smoke:
    name: smoke
    if: ${{ always() && !cancelled() }}
    needs: [health, check]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Agregar health + check
        env:
          HEALTH: ${{ needs.health.result }}
          CHECK: ${{ needs.check.result }}
        run: |
          echo "smoke ≡ health + check (compilación workspace)"
          echo "health=${HEALTH}"
          echo "check=${CHECK}"
          test "${HEALTH}" = success
          test "${CHECK}" = success

  secrets:
    name: secrets
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-security.yml
    with:
      suite: secrets

  sca:
    name: sca
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-security.yml
    with:
      suite: sca

  # S-08/S-15: zizmor + hadolint + FROM con digest (dentro de ci-gate).
  zizmor:
    name: zizmor
    needs: [health]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Instalar zizmor 1.31.1
        env:
          ZIZMOR_VERSION: "1.31.1"
          # sha256sum de zizmor-x86_64-unknown-linux-gnu.tar.gz (release v1.31.1).
          ZIZMOR_SHA256: "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99"
        run: |
          set -euo pipefail
          curl -sSfL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz
          sudo install -m 0755 zizmor /usr/local/bin/zizmor
          zizmor --version
      - name: Auditar workflows (sin medium+)
        run: |
          set -euo pipefail
          zizmor --format plain --min-severity medium .github/workflows

  hadolint:
    name: hadolint
    needs: [health]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Instalar hadolint 2.15.1
        env:
          HADOLINT_VERSION: "2.15.1"
          # sha256sum de hadolint-linux-x86_64 (release v2.15.1).
          HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
        run: |
          set -euo pipefail
          curl -sSfL -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/hadolint
          hadolint --version
      - name: Lint Dockerfiles
        run: |
          set -euo pipefail
          # DL3066 (info: USER no numérico) no debe tumbar el gate; fallar desde warning.
          hadolint --failure-threshold warning deploy/Dockerfile.api deploy/Dockerfile.web

  dockerfile-digests:
    name: dockerfile-digests
    needs: [health]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Exigir digest en todo FROM
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r -d '' f; do
            while IFS= read -r line; do
              # Ignorar comentarios y COPY --from=
              case "$line" in
                \#*|COPY\ --from=*|copy\ --from=*) continue ;;
              esac
              if echo "$line" | grep -qiE '^[[:space:]]*FROM[[:space:]]'; then
                if ! echo "$line" | grep -qE '@sha256:[a-fA-F0-9]{64}'; then
                  echo "SIN DIGEST: $f: $line"
                  bad=1
                fi
              fi
            done < "$f"
          done < <(find deploy -type f \( -name 'Dockerfile' -o -name 'Dockerfile.*' \) -print0)
          test "$bad" -eq 0


  # --- Escritorio AppImage (ADR-0021 / W5A) ---------------------------------
  # Build en ubuntu-22.04 (glibc + WebKitGTK 4.1). Artefactos listos para
  # `gh release upload` al draft (release.yml); este workflow no publica.
  #
  # Smoke en contenedor Ubuntu 26: omitido (P-07). Probe 2026-10-26 con
  # `ubuntu:26.04` + `--appimage-extract-and-run` + xvfb: la API loopback
  # arranca, pero EGL (`Could not create default EGL display`) y símbolos
  # GIO/curl (`nghttp2_option_set_no_rfc9113_…`) impiden un smoke estable.
  # No meter job rojo ni `continue-on-error` en ci-gate. Validación Ubuntu 26
  # = prueba manual del operador (docs/desktop.md).

  desktop-appimage:
    name: Desktop AppImage
    needs: [health, web]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      NO_STRIP: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: ". -> target"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Deps sistema Tauri/WebKit
        run: bash scripts/desktop/install-linux-deps.sh
      - name: Prefetch linuxdeploy (SHA256)
        run: bash scripts/desktop/prefetch-tauri-tools.sh
      - name: Build AppImage
        env:
          ZEDAZO_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZEDAZO_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export ZEDAZO_BUILD_DATE
          bash scripts/desktop/build-appimage.sh
      - name: Upload AppImage + checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-appimage
          path: |
            dist/desktop/*.AppImage
            dist/desktop/SHA256SUMS
            dist/desktop/build-info.txt
            dist/desktop/run-env.sh
            dist/desktop/gui/**
          if-no-files-found: error
          retention-days: 14

  # S-10: doble build informativo (dos SHA en el log). Fuera de ci-gate; no bloquea.
  desktop-appimage-repro:
    name: Desktop AppImage (repro SHA)
    needs: [desktop-appimage]
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      NO_STRIP: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Deps sistema
        run: bash scripts/desktop/install-linux-deps.sh
      - name: Prefetch linuxdeploy
        run: bash scripts/desktop/prefetch-tauri-tools.sh
      - name: Download primer AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-appimage
          path: dist/desktop-first
      - name: Segunda build
        env:
          ZEDAZO_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZEDAZO_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export ZEDAZO_BUILD_DATE
          bash scripts/desktop/build-appimage.sh
          FIRST=$(find dist/desktop-first -name '*.AppImage' -type f | sort | head -1)
          SECOND=$(find dist/desktop -name '*.AppImage' -type f | sort | head -1)
          echo "SHA_FIRST=$(sha256sum "$FIRST")"
          echo "SHA_SECOND=$(sha256sum "$SECOND")"
          # Informativo: no fallar si difieren (timestamps/rutas en el binario).

  desktop-smoke:
    name: Desktop smoke (xvfb)
    needs: [desktop-appimage]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Deps xvfb/FUSE
        run: bash scripts/desktop/install-linux-deps.sh
      - name: Download AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-appimage
          path: dist/desktop
      - name: Smoke xvfb
        run: bash scripts/desktop/smoke-xvfb.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"

  desktop-e2e:
    name: Desktop e2e (tauri-driver)
    needs: [desktop-appimage]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Deps sistema
        run: bash scripts/desktop/install-linux-deps.sh
      - name: Download AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-appimage
          path: dist/desktop
      - name: E2E sample.vcf + I7 + paridad API↔CLI
        run: bash scripts/desktop/run-e2e.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          ZEDAZO_RUN_PARITY: "1"

  # P-02: mismo e2e bajo unshare -rn + strace connect (solo loopback / AF_UNIX).
  desktop-no-network:
    name: Desktop e2e (no network)
    needs: [desktop-appimage]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Deps sistema + strace
        run: |
          set -euo pipefail
          bash scripts/desktop/install-linux-deps.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
      - name: Prefetch tauri-driver + npm (con red)
        run: |
          set -euo pipefail
          cargo install tauri-driver --version "=2.0.6" --locked
          npm ci --ignore-scripts --prefix scripts/desktop/e2e
      - name: Download AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-appimage
          path: dist/desktop
      - name: E2E bajo unshare -rn + strace
        run: bash scripts/desktop/e2e-no-network.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          ZEDAZO_OFFLINE: "1"

  desktop-parity:
    name: Desktop parity (cribar)
    needs: [check]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Paridad CLI cribar + I7
        run: bash scripts/desktop/parity-cribar.sh
      - name: Upload parity summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-parity
          path: |
            dist/desktop/parity-cribar.txt
            dist/desktop/parity-limpio.vcf
            dist/desktop/parity-audit.tsv
          if-no-files-found: error
          retention-days: 14

  # CR-1 / CR-2: tests de navegación del binario (sin AppImage).
  desktop-test:
    name: Desktop test (zedazo-desktop)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Deps sistema
        run: bash scripts/desktop/install-linux-deps.sh
      - name: Tests crate escritorio
        run: cargo test -p zedazo-desktop --locked

  desktop-sbom:
    name: Desktop SBOM (CycloneDX)
    needs: [health]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Generar SBOM cargo + pnpm
        run: bash scripts/desktop/sbom.sh
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-sbom
          path: |
            dist/desktop/sbom-*.json
            dist/desktop/SBOM.SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  desktop-attest:
    name: Desktop attest (provenance)
    needs: [desktop-appimage]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-appimage
          path: dist/desktop
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/desktop/*.AppImage

  # S-03: métricas dedup (no bloqueante; fuera de ci-gate).
  release-build:
    name: release-build (dedup perf)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: ". -> target"
      - name: Dedup 40k / cancel 100k (ignored)
        run: |
          set -euo pipefail
          cargo test -p zedazo-core --release --test dedup_perf -- --ignored --nocapture | tee dedup-perf.txt
      - name: Subir log de métricas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dedup-perf
          path: dedup-perf.txt
          if-no-files-found: ignore

  # Check único required (ruleset): agrega todos los jobs + secrets/sca + desktop.
  ci-gate:
    name: ci-gate
    if: ${{ always() && !cancelled() }}
    needs:
      - health
      - check
      - msrv
      - fmt
      - clippy
      - test
      - doc
      - docs-validate
      - parity
      - web
      - web-real-api
      - compose-smoke
      - deny
      - coverage
      - quality
      - smoke
      - secrets
      - sca
      - zizmor
      - hadolint
      - dockerfile-digests
      - desktop-appimage
      - desktop-smoke
      - desktop-e2e
      - desktop-no-network
      - desktop-parity
      - desktop-test
      - desktop-sbom
      - desktop-attest
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Verificar needs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -e '
            to_entries
            | map(select(.value.result != "success"))
            | if length == 0 then true else
                error("ci-gate: jobs no success: " + (map(.key + "=" + .value.result) | join(", ")))
              end
          ' >/dev/null
