# Publicación atestada del AppImage al release ya publicado (S-09).
# Dispara Alejandro al publicar el draft de release-please (tags v*).
# Entorno `production`: si no existe en el repo, crearlo (tarea del operador).

name: Publish desktop

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-desktop-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-appimage:
    name: Build AppImage + attest + upload
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      NO_STRIP: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Sin cachés Rust/npm (S-09).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Deps sistema Tauri/WebKit
        run: bash scripts/desktop/install-linux-deps.sh
      - name: Prefetch linuxdeploy (SHA256)
        run: bash scripts/desktop/prefetch-tauri-tools.sh
      - name: Build AppImage
        env:
          ZEDAZO_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export ZEDAZO_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash scripts/desktop/build-appimage.sh
      - name: SBOM
        run: bash scripts/desktop/sbom.sh
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/desktop/*.AppImage
      - name: Upload al release publicado
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            dist/desktop/*.AppImage \
            dist/desktop/SHA256SUMS \
            dist/desktop/build-info.txt \
            dist/desktop/sbom-*.json \
            dist/desktop/SBOM.SHA256SUMS \
            --clobber

  verify-release:
    name: verify-release
    needs: [publish-appimage]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Descargar AppImage del release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/desktop
          gh release download "$TAG" -D dist/desktop -p '*.AppImage' -p 'SHA256SUMS'
          ls -la dist/desktop
      - name: sha256sum -c
        run: |
          set -euo pipefail
          cd dist/desktop
          sha256sum -c SHA256SUMS
      - name: gh attestation verify
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          APP=$(find dist/desktop -maxdepth 1 -name '*.AppImage' -type f | sort | head -1)
          test -n "$APP"
          gh attestation verify "$APP" --repo Soluciones-Alexendros/zedazo
