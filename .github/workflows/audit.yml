# Security Audit — cargo audit contra RustSec.
#
# Política (ver `.cargo/audit.toml` y SECURITY.md):
# - Falla solo si hay vulnerabilidades (no por unmaintained/unsound/yanked).
# - Excepciones: IDs en `.cargo/audit.toml` y `deny.toml`, con motivo y revisión.
# - `createIssues: false`: el veredicto es el exit code de cargo-audit.
#   Abrir issues no forma parte del gate (el token de schedule no escribe issues
#   y un 403 no debe mezclarse con un advisory real).
name: Security Audit

on:
  schedule:
    - cron: '0 8 * * 1' # cada lunes 08:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - '.cargo/audit.toml'
      - 'deny.toml'
      - '.github/workflows/audit.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - '.cargo/audit.toml'
      - 'deny.toml'
      - '.github/workflows/audit.yml'

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1
        with:
          denyWarnings: false
          createIssues: false
