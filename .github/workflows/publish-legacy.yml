name: Publish legacy deprecation

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish vcf-cribador 0.1.2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: publish/vcf-cribador-0.1.2

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Verify package name
        run: |
          grep -q 'name = "vcf-cribador"' Cargo.toml
          grep -q 'version = "0.1.2"' Cargo.toml

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish
