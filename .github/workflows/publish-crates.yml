name: Publish crates.io

# Manual / recuperación cuando el job publish de release.yml se salta.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref a publicar (tag o commit)"
        required: true
        default: "v0.5.1"

permissions: {}

concurrency:
  group: publish-crates-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish zedazo-core + zedazo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Verify versions (Cargo metadata)
        env:
          PUBLISH_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          core=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="zedazo-core") | .version')
          cli=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="zedazo") | .version')
          echo "zedazo-core=$core zedazo=$cli ref=${PUBLISH_REF}"
          test -n "$core" && test "$core" = "$cli"
      - name: Publish zedazo-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p zedazo-core
      - name: Wait for crates.io index
        shell: bash
        run: |
          set -euo pipefail
          ver=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="zedazo-core") | .version')
          for i in $(seq 1 30); do
            if curl -fsS "https://crates.io/api/v1/crates/zedazo-core/$ver" >/dev/null; then
              echo "zedazo-core $ver visible"
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Publish zedazo
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p zedazo
