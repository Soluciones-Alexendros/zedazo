name: CodeQL

# SAST de las rutas críticas (zedazo-api, zedazo-carddav).
# La base de análisis es el workspace Rust: CodeQL no aísla dos crates.
# Fuera de ci-gate. build-mode none: el extractor de Rust no compila Tauri.
on:
  push:
    branches: [main]
    paths:
      - "crates/zedazo-api/**"
      - "crates/zedazo-carddav/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main, "plan/**", "release-please/**"]
    paths:
      - "crates/zedazo-api/**"
      - "crates/zedazo-carddav/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codeql.yml"
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: CodeQL Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:rust"
