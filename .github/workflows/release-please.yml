# Versionado Conventional Commits → PR de release + draft GitHub Release.
# draft: true en release-please-config.json; no publica ni hace cargo publish.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Solo en el PR de release: actualizar Cargo.lock de crates del workspace y empujar.
  # El commit se crea vía GraphQL `createCommitOnBranch` para que GitHub lo firme;
  # `main` exige commits firmados y un `git commit` local bloquearía el PR de release.
  update-lockfile:
    name: update-lockfile (release PR)
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Extraer rama del PR
        id: pr
        env:
          PR_JSON: ${{ needs.release-please.outputs.pr }}
        run: |
          set -euo pipefail
          head="$(python3 -c 'import json,os; print(json.loads(os.environ["PR_JSON"])["headBranchName"])')"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ steps.pr.outputs.head }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Actualizar Cargo.lock (solo workspace)
        run: cargo update --workspace
      - name: Empujar Cargo.lock firmado al PR de release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock sin cambios"
            exit 0
          fi
          export HEAD_SHA="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import base64, json, os

          contents = base64.b64encode(open("Cargo.lock", "rb").read()).decode()
          payload = {
              "query": "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              "variables": {
                  "input": {
                      "branch": {
                          "repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"],
                          "branchName": os.environ["HEAD_REF"],
                      },
                      "message": {"headline": "chore: regenerar Cargo.lock tras bump de versión"},
                      "expectedHeadOid": os.environ["HEAD_SHA"],
                      "fileChanges": {
                          "additions": [{"path": "Cargo.lock", "contents": contents}],
                      },
                  }
              },
          }
          with open("/tmp/release-lockfile.json", "w") as f:
              json.dump(payload, f)
          PY
          gh api graphql --input /tmp/release-lockfile.json
