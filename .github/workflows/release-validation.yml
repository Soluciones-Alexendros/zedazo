# Validación automática de cada release.
#
# Se dispara cuando termina el workflow `Release` (que corre al empujar un tag
# `v*` y sube los artefactos al draft de release-please), y también a mano con
# `workflow_dispatch` + tag.
#
# Valida lo que de verdad se va a publicar: assets, checksums, SBOM, smoke del
# binario, y paridad CLI↔API sobre el código del tag.
#
# No publica nada: el draft lo crea release-please y los assets los sube
# `release.yml` (job `host`). Este workflow solo verifica y falla si algo no cuadra.
#
# La validación pre-merge del PR de release-please vive en `ci.yml`
# (job `release-validation-pr`, agregado en `ci-gate`).

name: Release Validation

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a validar (p. ej. v0.6.2)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Resuelve el tag a validar. En workflow_run, head_branch es el nombre del tag.
  resolve:
    name: Resolver tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release_ok: ${{ steps.tag.outputs.release_ok }}
    steps:
      - id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RUN_BRANCH"
          fi
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Aviso: '$TAG' no parece un tag de release; se omite la validación."
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "release_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_ok=true" >> "$GITHUB_OUTPUT"
          echo "tag a validar: $TAG"
          if [[ "$EVENT" != "workflow_dispatch" ]]; then
            echo "resultado del workflow Release: $RUN_CONCLUSION"
          fi

  # 1. Assets publicados: presencia, checksums, SBOM y smoke del binario Linux.
  assets:
    name: Assets y checksums
    needs: [resolve]
    if: needs.resolve.outputs.release_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Descargar assets del draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$TAG" --dir artifacts --clobber
          ls -la artifacts
      - name: Checklist de assets requeridos
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          required=(
            zedazo-x86_64-unknown-linux-gnu.tar.xz
            zedazo-x86_64-unknown-linux-gnu.tar.xz.sha256
            zedazo-aarch64-unknown-linux-gnu.tar.xz
            zedazo-aarch64-unknown-linux-gnu.tar.xz.sha256
            zedazo-x86_64-apple-darwin.tar.xz
            zedazo-x86_64-apple-darwin.tar.xz.sha256
            zedazo-aarch64-apple-darwin.tar.xz
            zedazo-aarch64-apple-darwin.tar.xz.sha256
            zedazo-x86_64-pc-windows-msvc.zip
            zedazo-x86_64-pc-windows-msvc.zip.sha256
            sbom.json
            sbom.json.sha256
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "FALTA: $f"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "error: assets incompletos en la release" >&2
            exit 1
          fi
          echo "OK: todos los assets requeridos presentes."
      - name: Verificar checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          shopt -s nullglob
          for f in zedazo-*.tar.xz zedazo-*.zip; do
            expected=$(awk '{print $1}' "${f}.sha256")
            actual=$(sha256sum "$f" | awk '{print $1}')
            if [[ "$expected" != "$actual" ]]; then
              echo "error: checksum mismatch en $f" >&2
              exit 1
            fi
            echo "OK: $f"
          done
          expected=$(awk '{print $1}' sbom.json.sha256)
          actual=$(sha256sum sbom.json | awk '{print $1}')
          if [[ "$expected" != "$actual" ]]; then
            echo "error: checksum mismatch en sbom.json" >&2
            exit 1
          fi
          echo "OK: sbom.json"
      - name: Validar SBOM CycloneDX
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          jq -e 'type == "object" and (has("bomFormat") or has("metadata"))' sbom.json >/dev/null
          jq -e '(.components // []) | length > 0' sbom.json >/dev/null
          jq -r '.components[] | select(.name == "zedazo") | "OK: SBOM contiene \(.name)@\(.version)"' sbom.json
      - name: Smoke del binario Linux x86_64
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          tar -xJf zedazo-x86_64-unknown-linux-gnu.tar.xz
          BIN=$(find . -type f -name zedazo -perm -u+x | head -1)
          if [[ -z "$BIN" ]]; then
            echo "error: binario zedazo no encontrado en el tarball" >&2
            exit 1
          fi
          VERSION=$("$BIN" --version)
          echo "version: $VERSION"
          # La versión del binario debe coincidir con el tag.
          TAG="${{ needs.resolve.outputs.tag }}"
          echo "$VERSION" | grep -q -- "${TAG#v}" || {
            echo "error: versión del binario ($VERSION) no coincide con el tag ($TAG)" >&2
            exit 1
          }
          "$BIN" --help >/dev/null
          "$BIN" stats /dev/null >/dev/null 2>&1 || true
          echo "OK: smoke del binario."
      - name: Aviso si el workflow Release no terminó bien
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "::warning::El workflow Release terminó con '$CONCLUSION'; los assets pueden estar incompletos."

  # 2. AppImage (lo sube publish.yml al publicar la release).
  #    Si existe, se valida; si no, se avisa (no bloquea hasta que se publique).
  appimage:
    name: AppImage
    needs: [resolve]
    if: needs.resolve.outputs.release_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Descargar assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$TAG" --dir artifacts --clobber --pattern '*.AppImage*' || true
          ls -la artifacts
      - name: Validar AppImage
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.AppImage)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::notice::Sin AppImage en la release (se publica con publish.yml al publicar)."
            exit 0
          fi
          APPIMAGE="${files[0]}"
          chmod +x "$APPIMAGE"
          if [[ -f "${APPIMAGE}.sha256" ]]; then
            expected=$(awk '{print $1}' "${APPIMAGE}.sha256")
            actual=$(sha256sum "$APPIMAGE" | awk '{print $1}')
            if [[ "$expected" != "$actual" ]]; then
              echo "error: checksum mismatch del AppImage" >&2
              exit 1
            fi
            echo "OK: checksum del AppImage."
          fi
          # --appimage-extract-and-run evita necesitar FUSE en CI.
          "$APPIMAGE" --appimage-extract-and-run --version
          "$APPIMAGE" --appimage-extract-and-run --help >/dev/null
          echo "OK: AppImage ejecuta."

  # 3. Paridad CLI↔API (O10) sobre el código del tag.
  parity:
    name: Paridad CLI↔API (O10)
    needs: [resolve]
    if: needs.resolve.outputs.release_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Paridad (harness HTTP real)
        run: cargo test -p zedazo-api --test equivalence_http --all-features

  # 4. Gate: falla si algo crítico falló.
  gate:
    name: Release Gate
    needs: [resolve, assets, appimage, parity]
    if: always() && needs.resolve.outputs.release_ok == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Resumen
        env:
          ASSETS: ${{ needs.assets.result }}
          APPIMAGE: ${{ needs.appimage.result }}
          PARITY: ${{ needs.parity.result }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          echo "=== Validación de $TAG ==="
          echo "assets:   $ASSETS"
          echo "appimage: $APPIMAGE"
          echo "parity:   $PARITY"
          failed=0
          for r in "$ASSETS" "$APPIMAGE" "$PARITY"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "error: validación de release fallida" >&2
            exit 1
          fi
          echo "OK: release validada."
