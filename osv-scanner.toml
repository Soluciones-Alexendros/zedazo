# IgnoredVulns alineados con `.cargo/audit.toml` y `deny.toml` (ADR-0013 / ADR-0021).
# Revisar cuando Tauri/gtk-rs publiquen glib ≥ parche o dejen proc-macro-error.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
reason = "glib 0.18.5 (unsound VariantStrIter) transitivo de Tauri/wry en apps/desktop. Parche upstream en glib >=0.20, ausente del grafo. Comprobado 2026-11-18. Revisión 2027-02-18."

[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
reason = "Mismo advisory que RUSTSEC-2024-0429 (glib); ver ignore anterior."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
reason = "proc-macro-error 1.0.4 unmaintained; transitivo de Tauri/gtk-rs. RustSec no publica versión parcheada. Comprobado 2026-11-18. Revisión 2027-02-18."

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
reason = "block-buffer <0.12.1 (panic en buffer inline); sha2 0.10 / digest 0.10 fijan 0.10.4 y no hay 0.10.x parcheado. Revisión: al subir sha2 a 0.11+ (API digest nueva) en zedazo-api y tauri-codegen."

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
reason = "picomatch <= 4.0.7 vulnerable to ReDoS via single-branch repeated extglobs (CVE-2026-112366, CVSS 8.7). No patched version released yet (4.0.7 is latest). Affects transitive deps in apps/web. The app processes VCF files, not user-supplied glob patterns; exploit requires crafted extglob input. Revisión: cuando salga picomatch >= 4.0.8."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
reason = "chrono 0.4.45 unmaintained (informativo, no vulnerabilidad), ya solo transitivo de Tauri (serde_with -> tauri-utils). zedazo-api migró a jiff; el proyecto no bloquea avisos informativos (ver .cargo/audit.toml). Se elimina al subir Tauri, cuando serde_with deje de fijar chrono. Revisión: primer trimestre tras v0.7."

# Next.js 15.5.28 vulnerabilities (framework, no código propio)
# Upstream patches esperados en Next.js 15.6+. Revisión: al subir Next.js ≥15.6.
[[IgnoredVulns]]
id = "GHSA-7qx7-33qx-rqx2"
reason = "Next.js 15.5.28: deserialization vulnerability en middleware (CVSS 6.9). Afecta apps/web transitivamente. No código propio expone middleware vulnerable. Upstream patch en Next.js ≥15.6. Revisión: al subir Next.js."

[[IgnoredVulns]]
id = "GHSA-f3mh-rxg3-f5g2"
reason = "Next.js 15.5.28: path traversal en static file serving (CVSS 6.0). apps/web usa output: export (estático), no servidor Next.js en producción. Mitigado por arquitectura. Upstream patch en Next.js ≥15.6. Revisión: al subir Next.js."

[[IgnoredVulns]]
id = "GHSA-pc58-hwjq-p385"
reason = "Next.js 15.5.28: XSS via malicious headers en development mode (CVSS 6.3). Solo afecta modo desarrollo; producción usa export estático. Upstream patch en Next.js ≥15.6. Revisión: al subir Next.js."
