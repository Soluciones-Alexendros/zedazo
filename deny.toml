# cargo-deny configuration for Zedazo
# Ver ADR-0013 (aceptada) en DECISIONS.md

[advisories]
# Alineado con `.cargo/audit.toml` y `.github/workflows/audit.yml`:
# vulnerability → deny; unmaintained/unsound/yanked → no bloquean el audit job.
# Cada ignore: motivo, fecha y revisión; mismo ID en `.cargo/audit.toml`.
ignore = [
    # glib 0.18.x unsound (Tauri/wry); sin bump publicable. Revisión tras upgrade Tauri/gtk-rs. 2026-10-25
    "RUSTSEC-2024-0429",
    # proc-macro-error unmaintained (transitivo Tauri). Revisión tras upgrade Tauri. 2026-10-25
    "RUSTSEC-2024-0370",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # webpki-roots (reqwest rustls-tls en zedazo-carddav, ADR-0018)
    "CDLA-Permissive-2.0",
    # ring (backend TLS de rustls; ISC+MIT+OpenSSL en algunas versiones)
    "OpenSSL",
    # selectors (transitiva Tauri/wry vía dom_query; ADR-0021 apps/desktop)
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
deny = []
# Sin allowlist estricto: el grafo Axum/Tokio crece; se confía en licenses + advisories.
# Workspace crates y deps transitivas permitidas por defecto.
allow = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"