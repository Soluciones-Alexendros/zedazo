# Despliegue remoto single-user (ADR-0016).
# Uso: cp .env.example .env && docker compose -f docker-compose.remote.yml --env-file .env up --build
# URL: https://127.0.0.1:8443 (o dominio con Caddyfile.public)

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      ZEDAZO_BIND: 0.0.0.0:8080
      ZEDAZO_DATA_DIR: /var/lib/zedazo
      ZEDAZO_STORAGE_MODE: ephemeral
      ZEDAZO_MAX_UPLOAD_BYTES: "52428800"
      ZEDAZO_MAX_CONCURRENT_JOBS: "4"
      ZEDAZO_JOB_RETENTION_HOURS: "24"
      ZEDAZO_ALLOWED_HOSTS: "localhost:8443,127.0.0.1:8443"
      ZEDAZO_AUTH_MODE: token
      ZEDAZO_AUTH_TOKEN: ${ZEDAZO_AUTH_TOKEN:?set ZEDAZO_AUTH_TOKEN in .env}
      ZEDAZO_AUTH_COOKIE_SECURE: ${ZEDAZO_AUTH_COOKIE_SECURE:-true}
      ZEDAZO_CORS_ORIGIN: ${ZEDAZO_CORS_ORIGIN:-}
      ZEDAZO_OTEL_ENABLED: "false"
      # GUI off por defecto: no fijar ZEDAZO_STATIC_DIR (Caddy sirve el front).
    volumes:
      - zedazo-data:/var/lib/zedazo
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "zedazo-api", "--health-check"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Sin ports públicos: solo red interna + Caddy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://api:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  zedazo-data:
  caddy-data:
  caddy-config:
