# Stack local single-user: entrada única vía Caddy (same-origin).
# URL: https://127.0.0.1:8443
# Diagnóstico (puertos API/web): docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.diag.yml up --build

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      ZEDAZO_BIND: 0.0.0.0:8080
      ZEDAZO_DATA_DIR: /var/lib/zedazo
      ZEDAZO_STORAGE_MODE: ephemeral
      ZEDAZO_MAX_UPLOAD_BYTES: "52428800"
      ZEDAZO_JOB_RETENTION_HOURS: "24"
      ZEDAZO_AUTH_MODE: disabled
      ZEDAZO_AUTH_ALLOW_DISABLED_NON_LOOPBACK: "true"
      ZEDAZO_OTEL_ENABLED: "false"
    volumes:
      - zedazo-data:/var/lib/zedazo
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "zedazo-api", "--health-check"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Sin ports públicos: solo red interna + Caddy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # Comprueba el proxy hacia la API por la red interna (TLS interno puede fallar vía IP sin SNI).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://api:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  zedazo-data:
  caddy-data:
  caddy-config:
